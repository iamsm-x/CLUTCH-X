name: CLUTCH-X CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate

  analytics:
    name: Rebuild artifacts and enforce statistical gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: typst-community/setup-typst@v4
      - run: python -m pip install -e ".[dev]"
      - run: python -m clutch_x.etl.validate_sources --data-dir "Data Pack"
      - run: python -m clutch_x.etl.reconstruct_state --data-dir "Data Pack" --output-dir data/processed
      - run: python -m clutch_x.etl.score_pressure
      - run: python -m clutch_x.etl.validate_pressure
      - run: python -m clutch_x.etl.normalizer
      - run: python -m clutch_x.etl.score_batting
      - run: python -m clutch_x.etl.score_bowling
      - run: python -m clutch_x.etl.reliability_filter
      - run: python -m clutch_x.etl.rank_players
      - name: Audit rankings, materialize the store, and compile the report
        shell: bash
        run: |
          if python -m clutch_x.etl.ranking_audit; then
            audit_status=0
          else
            audit_status=$?
          fi
          python -m clutch_x.etl.build_store
          python -m clutch_x.report.build_report
          exit "$audit_status"

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
